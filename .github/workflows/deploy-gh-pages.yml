name: Deploy stats dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 5am US Eastern on Tuesdays. GitHub Actions cron is UTC-only and doesn't observe DST, so both
    # the EDT (UTC-4) and EST (UTC-5) offsets are scheduled; the guard step below skips the one
    # that doesn't match the current Eastern time.
    - cron: "0 9 * * 2"
    - cron: "0 10 * * 2"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip duplicate DST cron trigger
        id: dst_guard
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" != "05" ]; then
            echo "Current Eastern hour is $hour, not 05 — skipping this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dst_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.dst_guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        if: steps.dst_guard.outputs.skip != 'true'
        run: |
          cat <<EOF > .env
          LEAGUE_ID=${{ secrets.LEAGUE_ID }}
          ESPN_S2=${{ secrets.ESPN_S2 }}
          SWID=${{ secrets.SWID }}
          EOF

      - name: Generate HTML dashboard
        if: steps.dst_guard.outputs.skip != 'true'
        run: python run.py --no-csv

      - name: Prepare publish directory
        if: steps.dst_guard.outputs.skip != 'true'
        run: |
          mkdir -p publish
          cp output/html/Guarcino_Stats.html publish/index.html
          if [ -d output/html/assets ]; then cp -r output/html/assets publish/assets; fi

      - name: Deploy to gh-pages
        if: steps.dst_guard.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages

